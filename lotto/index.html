<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 6/45 시뮬레이터</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            color: #1d1d1f;
            background: #f5f5f7;
            overflow-x: hidden;
        }

        /* ===== 배경 오브 ===== */
        .bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 100%);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #a78bfa, #7c3aed);
            top: -10%; left: -5%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #f472b6, #ec4899);
            top: 30%; right: -10%;
            animation-delay: -7s;
        }
        .orb-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #60a5fa, #3b82f6);
            bottom: -5%; left: 20%;
            animation-delay: -14s;
        }
        .orb-4 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #fbbf24, #f59e0b);
            top: 60%; left: -8%;
            animation-delay: -3s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(10px, 10px) scale(1.02); }
        }

        /* ===== 헤더 ===== */
        .header {
            position: relative;
            z-index: 10;
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            background: rgba(255,255,255,0.72);
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header a {
            color: #6e6e73;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .header a:hover { color: #1d1d1f; }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.02em;
        }

        /* ===== 컨테이너 ===== */
        .container {
            position: relative;
            z-index: 10;
            max-width: 860px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* ===== 글래스 카드 ===== */
        .glass {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            background: rgba(255,255,255,0.72);
            border: 0.5px solid rgba(0,0,0,0.08);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.04);
            transition: box-shadow 0.3s;
        }
        .glass:hover {
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
        }
        .glass h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }
        .glass .desc {
            color: #86868b;
            font-size: 0.85rem;
            margin-bottom: 16px;
            font-weight: 400;
        }

        /* ===== 모드 선택 (세그먼트 컨트롤) ===== */
        .segment-control {
            display: flex;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 24px;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .seg-btn {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #6e6e73;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .seg-btn.active {
            background: #fff;
            color: #1d1d1f;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* ===== 번호판 ===== */
        .number-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .num-btn {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .num-btn.r1 { background: #fef3c7; color: #92400e; }
        .num-btn.r2 { background: #d1fae5; color: #065f46; }
        .num-btn.r3 { background: #fee2e2; color: #991b1b; }
        .num-btn.r4 { background: #e5e7eb; color: #374151; }
        .num-btn.r5 { background: #dbeafe; color: #1e40af; }
        .num-btn:hover { transform: scale(1.12); }
        .num-btn.selected {
            transform: scale(1.12);
            box-shadow: 0 0 0 3px #007aff;
        }
        .num-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 선택된 번호 표시 ===== */
        .selected-numbers {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 16px 0;
            min-height: 48px;
            align-items: center;
        }
        .sel-ball {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .empty-slot {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px dashed rgba(0,0,0,0.1);
        }

        /* ===== 게임 슬롯 ===== */
        .game-slots {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .game-slot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(0,0,0,0.03);
            border-radius: 14px;
            transition: background 0.2s;
        }
        .game-slot:hover { background: rgba(0,0,0,0.05); }
        .slot-label {
            font-size: 0.8rem;
            color: #86868b;
            font-weight: 600;
            min-width: 20px;
        }
        .slot-tag {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 36px;
            text-align: center;
        }
        .slot-tag.auto { background: #dbeafe; color: #1e40af; }
        .slot-tag.manual { background: #fef3c7; color: #92400e; }
        .slot-tag.semi { background: #d1fae5; color: #065f46; }
        .slot-numbers {
            display: flex;
            gap: 6px;
            flex: 1;
        }
        .slot-ball {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .slot-remove {
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .slot-remove:hover { opacity: 1; }

        /* ===== 버튼 ===== */
        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }
        .btn-blue {
            background: #007aff;
            color: #fff;
        }
        .btn-blue:hover { background: #0066d6; }
        .btn-gray {
            background: rgba(0,0,0,0.06);
            color: #1d1d1f;
        }
        .btn-gray:hover { background: rgba(0,0,0,0.1); }
        .btn-red {
            background: rgba(255,59,48,0.1);
            color: #ff3b30;
        }
        .btn-red:hover { background: rgba(255,59,48,0.18); }
        .btn-draw {
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: #fff;
            font-size: 1.05rem;
            padding: 14px 40px;
            border-radius: 14px;
        }
        .btn-draw:hover { box-shadow: 0 4px 16px rgba(0,122,255,0.35); }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== 수량 선택 ===== */
        .qty-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 16px 0;
        }
        .qty-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.06);
            color: #1d1d1f;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .qty-btn:hover { background: rgba(0,0,0,0.1); }
        .qty-display {
            font-size: 1.5rem;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
        }
        .price-tag {
            text-align: center;
            margin: 8px 0 16px;
            font-size: 0.9rem;
            color: #86868b;
        }
        .price-tag span { color: #1d1d1f; font-weight: 600; }

        /* ===== 결과 섹션 ===== */
        .result-section { display: none; }
        .result-section.show { display: block; }

        .winning-numbers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .win-ball {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.15rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        .bonus-sep {
            font-size: 1.4rem;
            color: #86868b;
            font-weight: 300;
            margin: 0 4px;
        }
        .bonus-label {
            font-size: 0.65rem;
            color: #86868b;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        @keyframes popIn {
            from { transform: scale(0) rotate(-20deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* ===== 결과 테이블 ===== */
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        .result-table th {
            padding: 8px;
            text-align: center;
            font-size: 0.75rem;
            color: #86868b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .result-table td {
            padding: 10px 8px;
            text-align: center;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .result-match { color: #34c759; font-weight: 600; }
        .result-nums {
            display: flex;
            gap: 4px;
            justify-content: center;
        }
        .mini-ball {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.6rem;
        }
        .mini-ball.matched {
            outline: 2.5px solid #34c759;
            outline-offset: 2px;
        }
        .rank-pill {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; }
        .rank-2 { background: linear-gradient(135deg, #9ca3af, #6b7280); color: #fff; }
        .rank-3 { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
        .rank-4 { background: #d1fae5; color: #065f46; }
        .rank-5 { background: #dbeafe; color: #1e40af; }
        .rank-none { background: rgba(0,0,0,0.04); color: #86868b; }

        /* ===== 통계 카드 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .stat-card {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            background: rgba(255,255,255,0.72);
            border: 0.5px solid rgba(0,0,0,0.08);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.02em;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #86868b;
            margin-top: 4px;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .number-grid { grid-template-columns: repeat(7, 1fr); gap: 6px; }
            .num-btn { font-size: 0.75rem; }
            .win-ball { width: 42px; height: 42px; font-size: 0.95rem; }
            .container { padding: 0 0.75rem; }
            .glass { padding: 20px; border-radius: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <div class="header">
        <a href="../index.html">← 게임센터</a>
        <h1>로또 6/45</h1>
        <div style="width:70px"></div>
    </div>

    <div class="container">
        <!-- 모드 선택 -->
        <div class="segment-control">
            <button class="seg-btn active" onclick="setMode('auto')">자동</button>
            <button class="seg-btn" onclick="setMode('manual')">수동</button>
            <button class="seg-btn" onclick="setMode('semi')">반자동</button>
        </div>

        <!-- 자동 모드 -->
        <div id="auto-panel" class="glass">
            <h2>자동 번호 생성</h2>
            <p class="desc">원하는 게임 수를 선택하세요 (최대 5게임)</p>
            <div class="qty-row">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <div class="qty-display" id="qty-display">1</div>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <div class="price-tag">금액: <span id="price-display">1,000원</span></div>
            <div class="btn-row">
                <button class="btn btn-blue" onclick="addAutoGames()">자동 생성</button>
            </div>
        </div>

        <!-- 수동 모드 -->
        <div id="manual-panel" class="glass" style="display:none;">
            <h2>수동 번호 선택</h2>
            <p class="desc">6개의 번호를 직접 선택하세요 (1~45)</p>
            <div class="selected-numbers" id="manual-selected"></div>
            <div class="number-grid" id="number-grid"></div>
            <div class="btn-row">
                <button class="btn btn-gray" onclick="clearManual()">초기화</button>
                <button class="btn btn-blue" id="manual-confirm-btn" onclick="confirmManual()" disabled>선택 완료</button>
            </div>
        </div>

        <!-- 반자동 모드 -->
        <div id="semi-panel" class="glass" style="display:none;">
            <h2>반자동 번호 선택</h2>
            <p class="desc">일부 번호를 선택하면 나머지는 자동으로 채워집니다</p>
            <div class="selected-numbers" id="semi-selected"></div>
            <div class="number-grid" id="semi-number-grid"></div>
            <div class="btn-row">
                <button class="btn btn-gray" onclick="clearSemi()">초기화</button>
                <button class="btn btn-blue" onclick="confirmSemi()">나머지 자동 생성</button>
            </div>
        </div>

        <!-- 선택된 게임 목록 -->
        <div class="glass" id="games-panel" style="display:none;">
            <h2>선택한 게임 <span id="games-count" style="color:#86868b;font-weight:400;"></span></h2>
            <div class="game-slots" id="game-slots"></div>
            <div class="price-tag">총 금액: <span id="total-price">0원</span></div>
            <div class="btn-row">
                <button class="btn btn-red" onclick="clearAllGames()">전체 삭제</button>
                <button class="btn btn-draw" id="draw-btn" onclick="startDraw()">추첨하기</button>
            </div>
        </div>

        <!-- 추첨 결과 -->
        <div class="result-section" id="result-section">
            <div class="glass">
                <h2>당첨 번호</h2>
                <div class="winning-numbers" id="winning-numbers"></div>
            </div>
            <div class="glass">
                <h2>내 결과</h2>
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>게임</th>
                            <th>번호</th>
                            <th>일치</th>
                            <th>등수</th>
                            <th>상금</th>
                        </tr>
                    </thead>
                    <tbody id="result-body"></tbody>
                </table>
            </div>
            <div class="stats-grid" id="stats"></div>
            <div class="btn-row" style="margin-top:20px;">
                <button class="btn btn-gray" onclick="resetAll()">다시 하기</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'auto';
        let autoQty = 1;
        let manualNumbers = [];
        let semiNumbers = [];
        let games = [];
        const MAX_GAMES = 5;

        // 공 색상 (Apple 스타일 — 밝고 부드러운 톤)
        function getBallColor(num) {
            if (num <= 10) return '#fbbf24';
            if (num <= 20) return '#34d399';
            if (num <= 30) return '#f87171';
            if (num <= 40) return '#9ca3af';
            return '#60a5fa';
        }
        function getBallTextColor(num) {
            if (num <= 10) return '#78350f';
            if (num <= 20) return '#064e3b';
            if (num <= 30) return '#fff';
            if (num <= 40) return '#fff';
            return '#fff';
        }
        function getRangeClass(num) {
            if (num <= 10) return 'r1';
            if (num <= 20) return 'r2';
            if (num <= 30) return 'r3';
            if (num <= 40) return 'r4';
            return 'r5';
        }

        // 모드 전환
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.seg-btn').forEach((btn, i) => {
                btn.classList.toggle('active',
                    (mode === 'auto' && i === 0) ||
                    (mode === 'manual' && i === 1) ||
                    (mode === 'semi' && i === 2)
                );
            });
            document.getElementById('auto-panel').style.display = mode === 'auto' ? 'block' : 'none';
            document.getElementById('manual-panel').style.display = mode === 'manual' ? 'block' : 'none';
            document.getElementById('semi-panel').style.display = mode === 'semi' ? 'block' : 'none';
        }

        // 숫자 그리드
        function createNumberGrid(containerId, clickHandler) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            for (let i = 1; i <= 45; i++) {
                const btn = document.createElement('button');
                btn.className = `num-btn ${getRangeClass(i)}`;
                btn.textContent = i;
                btn.dataset.num = i;
                btn.onclick = () => clickHandler(i, btn);
                grid.appendChild(btn);
            }
        }

        // 공 HTML
        function ballHTML(num, cls, matched) {
            const mcls = matched ? ' matched' : '';
            return `<div class="${cls}${mcls}" style="background:${getBallColor(num)};color:${getBallTextColor(num)}">${num}</div>`;
        }

        function updateSelectedDisplay(containerId, numbers, total = 6) {
            const el = document.getElementById(containerId);
            let html = '';
            for (let i = 0; i < total; i++) {
                html += numbers[i] ? ballHTML(numbers[i], 'sel-ball') : '<div class="empty-slot"></div>';
            }
            el.innerHTML = html;
        }

        // 랜덤 번호 (정렬)
        function generateRandomNumbers(exclude = [], count = 6) {
            const available = [];
            for (let i = 1; i <= 45; i++) {
                if (!exclude.includes(i)) available.push(i);
            }
            const result = [...exclude];
            while (result.length < count) {
                const idx = Math.floor(Math.random() * available.length);
                result.push(available[idx]);
                available.splice(idx, 1);
            }
            return result.sort((a, b) => a - b);
        }

        // 보너스 번호 별도 생성 (정렬 문제 수정)
        function generateBonusNumber(mainNumbers) {
            let bonus;
            do {
                bonus = Math.floor(Math.random() * 45) + 1;
            } while (mainNumbers.includes(bonus));
            return bonus;
        }

        // 자동 수량
        function changeQty(delta) {
            autoQty = Math.max(1, Math.min(MAX_GAMES - games.length, autoQty + delta));
            document.getElementById('qty-display').textContent = autoQty;
            document.getElementById('price-display').textContent = (autoQty * 1000).toLocaleString() + '원';
        }

        function addAutoGames() {
            if (games.length >= MAX_GAMES) return alert('최대 5게임까지 가능합니다.');
            const count = Math.min(autoQty, MAX_GAMES - games.length);
            for (let i = 0; i < count; i++) {
                games.push({ type: 'auto', numbers: generateRandomNumbers() });
            }
            autoQty = 1;
            document.getElementById('qty-display').textContent = 1;
            document.getElementById('price-display').textContent = '1,000원';
            updateGameSlots();
        }

        // 수동 모드
        createNumberGrid('number-grid', (num, btn) => {
            if (manualNumbers.includes(num)) {
                manualNumbers = manualNumbers.filter(n => n !== num);
                btn.classList.remove('selected');
            } else if (manualNumbers.length < 6) {
                manualNumbers.push(num);
                manualNumbers.sort((a, b) => a - b);
                btn.classList.add('selected');
            }
            updateSelectedDisplay('manual-selected', manualNumbers);
            document.getElementById('manual-confirm-btn').disabled = manualNumbers.length !== 6;
            document.querySelectorAll('#number-grid .num-btn').forEach(b => {
                const n = parseInt(b.dataset.num);
                b.classList.toggle('disabled', manualNumbers.length >= 6 && !manualNumbers.includes(n));
            });
        });

        function clearManual() {
            manualNumbers = [];
            updateSelectedDisplay('manual-selected', []);
            document.getElementById('manual-confirm-btn').disabled = true;
            document.querySelectorAll('#number-grid .num-btn').forEach(b => b.classList.remove('selected', 'disabled'));
        }

        function confirmManual() {
            if (manualNumbers.length !== 6) return;
            if (games.length >= MAX_GAMES) return alert('최대 5게임까지 가능합니다.');
            games.push({ type: 'manual', numbers: [...manualNumbers] });
            clearManual();
            updateGameSlots();
        }

        // 반자동 모드
        createNumberGrid('semi-number-grid', (num, btn) => {
            if (semiNumbers.includes(num)) {
                semiNumbers = semiNumbers.filter(n => n !== num);
                btn.classList.remove('selected');
            } else if (semiNumbers.length < 5) {
                semiNumbers.push(num);
                semiNumbers.sort((a, b) => a - b);
                btn.classList.add('selected');
            }
            updateSelectedDisplay('semi-selected', semiNumbers);
            document.querySelectorAll('#semi-number-grid .num-btn').forEach(b => {
                const n = parseInt(b.dataset.num);
                b.classList.toggle('disabled', semiNumbers.length >= 5 && !semiNumbers.includes(n));
            });
        });

        function clearSemi() {
            semiNumbers = [];
            updateSelectedDisplay('semi-selected', []);
            document.querySelectorAll('#semi-number-grid .num-btn').forEach(b => b.classList.remove('selected', 'disabled'));
        }

        function confirmSemi() {
            if (semiNumbers.length === 0) return alert('최소 1개 이상의 번호를 선택하세요.');
            if (games.length >= MAX_GAMES) return alert('최대 5게임까지 가능합니다.');
            games.push({ type: 'semi', numbers: generateRandomNumbers(semiNumbers) });
            clearSemi();
            updateGameSlots();
        }

        // 게임 슬롯
        function updateGameSlots() {
            const panel = document.getElementById('games-panel');
            const slotsDiv = document.getElementById('game-slots');
            if (games.length === 0) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
            document.getElementById('games-count').textContent = `(${games.length}/5)`;
            document.getElementById('total-price').textContent = (games.length * 1000).toLocaleString() + '원';

            slotsDiv.innerHTML = games.map((g, i) => {
                const labels = { auto: '자동', manual: '수동', semi: '반자동' };
                return `<div class="game-slot">
                    <span class="slot-label">${String.fromCharCode(65 + i)}</span>
                    <span class="slot-tag ${g.type}">${labels[g.type]}</span>
                    <div class="slot-numbers">
                        ${g.numbers.map(n => `<div class="slot-ball" style="background:${getBallColor(n)};color:${getBallTextColor(n)}">${n}</div>`).join('')}
                    </div>
                    <button class="slot-remove" onclick="removeGame(${i})">✕</button>
                </div>`;
            }).join('');
            changeQty(0);
        }

        function removeGame(i) { games.splice(i, 1); updateGameSlots(); }
        function clearAllGames() { games = []; updateGameSlots(); }

        // 추첨
        function startDraw() {
            if (games.length === 0) return;

            // 당첨 번호: 6개 메인 + 별도 보너스
            const mainNumbers = generateRandomNumbers([], 6);
            const bonusNumber = generateBonusNumber(mainNumbers);

            // 당첨 번호 표시 (innerHTML 누적 대신 DOM append)
            const winDiv = document.getElementById('winning-numbers');
            winDiv.innerHTML = '';

            mainNumbers.forEach((num, i) => {
                setTimeout(() => {
                    winDiv.insertAdjacentHTML('beforeend', ballHTML(num, 'win-ball'));
                    // 마지막 번호 뒤에 보너스 추가
                    if (i === 5) {
                        setTimeout(() => {
                            winDiv.insertAdjacentHTML('beforeend',
                                `<div class="bonus-sep">+</div>
                                 <div style="text-align:center">
                                     <div class="bonus-label">보너스</div>
                                     ${ballHTML(bonusNumber, 'win-ball')}
                                 </div>`
                            );
                        }, 300);
                    }
                }, i * 280);
            });

            setTimeout(() => showResults(mainNumbers, bonusNumber), 2100);

            document.getElementById('result-section').classList.add('show');
            document.getElementById('draw-btn').disabled = true;
            setTimeout(() => document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' }), 500);
        }

        function showResults(mainNumbers, bonusNumber) {
            const tbody = document.getElementById('result-body');
            let totalPrize = 0;

            tbody.innerHTML = games.map((game, i) => {
                const matchCount = game.numbers.filter(n => mainNumbers.includes(n)).length;
                const hasBonus = game.numbers.includes(bonusNumber);

                let rank, prize, rc;
                if (matchCount === 6) { rank = 1; prize = 2000000000; rc = 'rank-1'; }
                else if (matchCount === 5 && hasBonus) { rank = 2; prize = 60000000; rc = 'rank-2'; }
                else if (matchCount === 5) { rank = 3; prize = 1500000; rc = 'rank-3'; }
                else if (matchCount === 4) { rank = 4; prize = 50000; rc = 'rank-4'; }
                else if (matchCount === 3) { rank = 5; prize = 5000; rc = 'rank-5'; }
                else { rank = 0; prize = 0; rc = 'rank-none'; }

                totalPrize += prize;

                const numsHTML = game.numbers.map(n => {
                    const matched = mainNumbers.includes(n) || n === bonusNumber;
                    return ballHTML(n, 'mini-ball', matched);
                }).join('');

                return `<tr>
                    <td>${String.fromCharCode(65 + i)}</td>
                    <td><div class="result-nums">${numsHTML}</div></td>
                    <td class="result-match">${matchCount}개${hasBonus ? '+보너스' : ''}</td>
                    <td><span class="rank-pill ${rc}">${rank > 0 ? rank + '등' : '낙첨'}</span></td>
                    <td>${prize > 0 ? prize.toLocaleString() + '원' : '−'}</td>
                </tr>`;
            }).join('');

            const spent = games.length * 1000;
            const profit = totalPrize - spent;
            const profitColor = profit >= 0 ? '#34c759' : '#ff3b30';

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${spent.toLocaleString()}원</div>
                    <div class="stat-label">투자 금액</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalPrize.toLocaleString()}원</div>
                    <div class="stat-label">당첨 금액</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color:${profitColor}">${profit >= 0 ? '+' : ''}${profit.toLocaleString()}원</div>
                    <div class="stat-label">수익</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color:${profitColor}">${spent > 0 ? (totalPrize / spent * 100).toFixed(1) : 0}%</div>
                    <div class="stat-label">수익률</div>
                </div>`;
        }

        function resetAll() {
            games = [];
            updateGameSlots();
            document.getElementById('result-section').classList.remove('show');
            document.getElementById('draw-btn').disabled = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 초기화
        updateSelectedDisplay('manual-selected', []);
        updateSelectedDisplay('semi-selected', []);
    </script>
</body>
</html>
