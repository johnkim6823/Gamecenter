<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티켓팅 시뮬레이터</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* 인터파크 스타일 헤더 */
        .top-bar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 8px 0;
            font-size: 0.75rem;
            color: #888;
        }
        .top-bar .inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
        }
        .top-bar a { color: #888; text-decoration: none; margin-left: 10px; }

        .header {
            background: #fff;
            border-bottom: 2px solid #502b6e;
            padding: 0.8rem 0;
        }
        .header .inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo-icon {
            background: #502b6e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #502b6e;
        }
        .logo-sub { color: #e91e63; font-size: 0.9rem; margin-left: 2px; }
        .home-link {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .home-link:hover { color: #502b6e; }

        .nav-bar {
            background: #502b6e;
            padding: 0;
        }
        .nav-bar .inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
        }
        .nav-item {
            color: #fff;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.15); }

        /* 메인 컨텐츠 */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* 단계별 화면 */
        .step { display: none; }
        .step.active { display: block; }

        /* 공연 목록 */
        .event-banner {
            background: linear-gradient(135deg, #502b6e, #7b1fa2);
            border-radius: 8px;
            padding: 2rem;
            color: #fff;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .event-banner h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .event-banner p { opacity: 0.8; }

        .event-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .event-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .event-poster {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .event-info {
            padding: 1rem;
        }
        .event-info h3 {
            font-size: 1rem;
            margin-bottom: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .event-info .venue { color: #888; font-size: 0.8rem; margin-bottom: 0.3rem; }
        .event-info .date { color: #502b6e; font-size: 0.85rem; font-weight: bold; }
        .event-badge {
            display: inline-block;
            background: #e91e63;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 0.3rem;
        }

        /* 공연 상세 */
        .detail-top {
            display: flex;
            gap: 2rem;
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 1.5rem;
        }
        .detail-poster {
            width: 250px;
            height: 330px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            flex-shrink: 0;
        }
        .detail-info { flex: 1; }
        .detail-info h2 { font-size: 1.5rem; margin-bottom: 0.8rem; }
        .detail-table {
            width: 100%;
            font-size: 0.9rem;
        }
        .detail-table td {
            padding: 6px 0;
            vertical-align: top;
        }
        .detail-table td:first-child {
            color: #888;
            width: 80px;
        }

        /* 날짜/회차 선택 */
        .date-selector {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 1.5rem;
        }
        .date-selector h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #502b6e;
            color: #502b6e;
        }
        .date-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .date-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .date-btn:hover { border-color: #502b6e; }
        .date-btn.selected {
            background: #502b6e;
            color: #fff;
            border-color: #502b6e;
        }
        .date-btn.soldout {
            background: #f5f5f5;
            color: #ccc;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .time-slots {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .time-btn {
            padding: 8px 20px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .time-btn:hover { border-color: #502b6e; }
        .time-btn.selected {
            background: #502b6e;
            color: #fff;
            border-color: #502b6e;
        }
        .time-btn .remaining {
            display: block;
            font-size: 0.7rem;
            color: #e91e63;
            margin-top: 2px;
        }
        .time-btn.selected .remaining { color: #ffcdd2; }

        /* 대기열 */
        .queue-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .queue-overlay.show { display: flex; }
        .queue-box {
            background: #fff;
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .queue-box h2 {
            color: #502b6e;
            margin-bottom: 1rem;
        }
        .queue-number {
            font-size: 3rem;
            font-weight: bold;
            color: #e91e63;
            margin: 1rem 0;
        }
        .queue-info {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #502b6e, #e91e63);
            border-radius: 4px;
            transition: width 0.5s;
        }
        .queue-warning {
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            border-radius: 6px;
            padding: 0.8rem;
            font-size: 0.8rem;
            color: #e65100;
            margin-top: 1rem;
        }

        /* 좌석 선택 */
        .seat-section {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .seat-section h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #502b6e;
            color: #502b6e;
        }
        .grade-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .grade-tab {
            padding: 6px 16px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .grade-tab:hover { border-color: #502b6e; }
        .grade-tab.active {
            background: #502b6e;
            color: #fff;
            border-color: #502b6e;
        }
        .grade-tab .price {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .stage {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 15px;
            border-radius: 40% 40% 0 0 / 100% 100% 0 0;
            margin: 0 auto 1.5rem;
            max-width: 300px;
            font-size: 0.9rem;
            letter-spacing: 5px;
        }

        .seat-map {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 1rem 0;
            overflow-x: auto;
        }
        .seat-row {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .row-label {
            width: 24px;
            text-align: center;
            font-size: 0.7rem;
            color: #888;
        }
        .seat {
            width: 24px;
            height: 24px;
            border-radius: 4px 4px 0 0;
            border: none;
            cursor: pointer;
            font-size: 0.55rem;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .seat.available { background: #a5d6a7; color: #2e7d32; }
        .seat.available:hover { background: #66bb6a; transform: scale(1.2); }
        .seat.selected { background: #502b6e; color: #fff; transform: scale(1.15); }
        .seat.taken { background: #e0e0e0; color: #bbb; cursor: not-allowed; }
        .seat.gap { visibility: hidden; }

        .seat-legend {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1rem 0;
            font-size: 0.8rem;
            color: #888;
        }
        .seat-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        /* 선택 정보 사이드바 */
        .seat-layout {
            display: flex;
            gap: 1.5rem;
        }
        .seat-map-area { flex: 1; }
        .seat-info-sidebar {
            width: 280px;
            flex-shrink: 0;
        }
        .info-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }
        .info-box h4 {
            font-size: 0.85rem;
            color: #502b6e;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        .info-row .label { color: #888; }
        .info-row .value { font-weight: bold; }
        .info-row.total {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #e0e0e0;
            font-size: 1rem;
        }
        .info-row.total .value { color: #e91e63; }
        .selected-seat-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.8rem;
        }
        .selected-seat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .selected-seat-item button {
            background: none;
            border: none;
            color: #e91e63;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* 타이머 */
        .timer-bar {
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            border-radius: 8px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .timer-bar .time {
            font-weight: bold;
            color: #e91e63;
            font-size: 1.2rem;
        }

        /* 결제 */
        .payment-section {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 1rem;
        }
        .payment-section h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #502b6e;
            color: #502b6e;
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 1.5rem;
        }
        .payment-method {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .payment-method:hover { border-color: #502b6e; }
        .payment-method.selected {
            border-color: #502b6e;
            background: #f3e5f5;
        }
        .payment-method .icon { font-size: 1.5rem; margin-bottom: 0.3rem; }

        .order-summary {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .order-summary h4 {
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        /* CAPTCHA */
        .captcha-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .captcha-image {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px 30px;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            color: #333;
            position: relative;
            user-select: none;
        }
        .captcha-image::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                rgba(0,0,0,0.03) 5px,
                rgba(0,0,0,0.03) 10px
            );
        }
        .captcha-input {
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            width: 200px;
            text-align: center;
            letter-spacing: 3px;
        }
        .captcha-refresh {
            background: none;
            border: none;
            color: #502b6e;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* 버튼들 */
        .btn-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: #502b6e;
            color: #fff;
        }
        .btn-primary:hover { background: #7b1fa2; }
        .btn-secondary {
            background: #fff;
            color: #502b6e;
            border: 1px solid #502b6e;
        }
        .btn-pink {
            background: #e91e63;
            color: #fff;
        }
        .btn-pink:hover { background: #c2185b; }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* 결과 */
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .result-overlay.show { display: flex; }
        .result-box {
            background: #fff;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .result-icon { font-size: 5rem; margin-bottom: 1rem; }
        .result-box h2 { margin-bottom: 0.5rem; }
        .result-box p { color: #888; margin-bottom: 1.5rem; line-height: 1.6; }
        .result-details {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .result-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .result-detail-row .label { color: #888; }

        /* 에러 / 실패 결과 */
        .fail-result h2 { color: #e91e63; }

        /* 로딩 스피너 */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #502b6e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 반응형 */
        @media (max-width: 768px) {
            .detail-top { flex-direction: column; }
            .detail-poster { width: 100%; height: 200px; }
            .seat-layout { flex-direction: column; }
            .seat-info-sidebar { width: 100%; }
            .seat { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <!-- 상단바 -->
    <div class="top-bar">
        <div class="inner">
            <span>티켓팅 시뮬레이터 v1.0</span>
            <span>
                <a href="../index.html">게임센터로 돌아가기</a>
            </span>
        </div>
    </div>

    <!-- 헤더 -->
    <div class="header">
        <div class="inner">
            <a href="#" class="logo" onclick="goToStep('list'); return false;">
                <span class="logo-icon">IP</span>
                <span class="logo-text">인터파크<span class="logo-sub">티켓</span></span>
            </a>
            <a href="../index.html" class="home-link">← 게임센터</a>
        </div>
    </div>

    <!-- 네비게이션 -->
    <div class="nav-bar">
        <div class="inner">
            <a class="nav-item active">콘서트</a>
            <a class="nav-item">뮤지컬</a>
            <a class="nav-item">스포츠</a>
            <a class="nav-item">클래식</a>
            <a class="nav-item">전시</a>
        </div>
    </div>

    <!-- 대기열 오버레이 -->
    <div class="queue-overlay" id="queue-overlay">
        <div class="queue-box">
            <h2>접속 대기 중</h2>
            <p style="color:#888;">현재 접속자가 많아 대기 중입니다.</p>
            <div class="queue-number" id="queue-number">--</div>
            <div class="queue-info">내 앞 대기인원: <span id="queue-ahead">--</span>명</div>
            <div class="progress-bar">
                <div class="progress-fill" id="queue-progress" style="width:0%"></div>
            </div>
            <div class="queue-info">예상 대기시간: <span id="queue-eta">--</span></div>
            <div class="queue-warning">
                ⚠ 새로고침 하시면 대기 순서가 초기화됩니다.<br>
                창을 닫지 마시고 기다려 주세요.
            </div>
        </div>
    </div>

    <!-- 결과 오버레이 -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-box" id="result-box"></div>
    </div>

    <div class="main">
        <!-- STEP 1: 공연 목록 -->
        <div class="step active" id="step-list">
            <div class="event-banner">
                <h2>HOT 티켓 오픈</h2>
                <p>지금 가장 뜨거운 공연 티켓을 예매하세요!</p>
            </div>
            <div class="event-list" id="event-list"></div>
        </div>

        <!-- STEP 2: 공연 상세 + 날짜/시간 선택 -->
        <div class="step" id="step-detail"></div>

        <!-- STEP 3: 좌석 선택 -->
        <div class="step" id="step-seat"></div>

        <!-- STEP 4: 결제 -->
        <div class="step" id="step-payment"></div>
    </div>

    <script>
        // ========== 데이터 ==========
        const events = [
            {
                id: 1,
                title: '2026 BTS 월드투어 [Yet To Come] - 서울',
                artist: 'BTS',

            const queueNum = document.getElementById('queue-number');

            const queueProgress = document.getElementById('queue-progress');
            const queueEta = document.getElementById('queue-eta');

            queueNum.textContent = position.toLocaleString();
            queueAhead.textContent = position.toLocaleString();
            queueProgress.style.width = '0%';
            queueEta.textContent = Math.ceil(position / 500) + '분';

            const interval = setInterval(() => {
                const decrease = Math.floor(Math.random() * 800) + 200;
                position = Math.max(0, position - decrease);

                queueNum.textContent = position.toLocaleString();
                queueAhead.textContent = position.toLocaleString();
                const pct = ((total - position) / total * 100).toFixed(1);
                queueProgress.style.width = pct + '%';
                queueEta.textContent = position > 0 ? Math.ceil(position / 500) + '분' : '곧 입장합니다...';

                if (position <= 0) {
                    clearInterval(interval);
                    setTimeout(() => {
                        overlay.classList.remove('show');
                        generateSeatMap();
                        renderSeatStep();
                        goToStep('seat');
                        startTimer();

            const e = state.currentEvent;
            const rows = 15;
            const cols = 20;
            state.seatMap = [];
            state.selectedSeats = [];

            // 좌석 배치 생성
            const takenRate = e.popularity / 100 * 0.6 + Math.random() * 0.2;

            for (let r = 0; r < rows; r++) {
                const row = [];
                for (let c = 0; c < cols; c++) {
                    // 통로
                    if (c === 4 || c === 15) {
                        row.push({ type: 'gap' });
                        continue;
                    }

                    // 등급 결정 (앞쪽이 높은 등급)
                    let gradeIdx;
                    if (r < 3) gradeIdx = 0;
                    else if (r < 6) gradeIdx = Math.min(1, e.grades.length - 1);
                    else if (r < 10) gradeIdx = Math.min(2, e.grades.length - 1);
                    else gradeIdx = Math.min(3, e.grades.length - 1);

                    const taken = Math.random() < takenRate;
                    row.push({
                        type: taken ? 'taken' : 'available',
                        grade: gradeIdx,
                        row: r,
                        col: c,
                        label: `${String.fromCharCode(65 + r)}${c + 1}`
                    });
                }
                state.seatMap.push(row);
            }
        }

        function renderSeatMap(gradeFilter) {
            const mapDiv = document.getElementById('seat-map');
            const e = state.currentEvent;

            mapDiv.innerHTML = state.seatMap.map((row, r) => {
                const seats = row.map((seat, c) => {
                    if (seat.type === 'gap') return '<div class="seat gap"></div>';

                    const isSelected = state.selectedSeats.some(s => s.row === r && s.col === c);
                    const dimmed = gradeFilter >= 0 && seat.grade !== gradeFilter && seat.type !== 'taken';

                    if (seat.type === 'taken') {
                        return `<div class="seat taken" title="예매완료"></div>`;
                    }

                    const cls = isSelected ? 'selected' : 'available';
                    const style = dimmed ? 'opacity:0.2;' : '';
                    const gradeColor = e.grades[seat.grade]?.color || '#a5d6a7';

                    return `<div class="seat ${cls}" style="${style}${!isSelected ? `background:${gradeColor}33; border: 1px solid ${gradeColor};` : ''}"
                        onclick="toggleSeat(${r},${c})" title="${seat.label} (${e.grades[seat.grade]?.name})"></div>`;
                }).join('');

                return `<div class="seat-row">
                    <span class="row-label">${String.fromCharCode(65 + r)}</span>
                    ${seats}
                    <span class="row-label">${String.fromCharCode(65 + r)}</span>
                </div>`;
            }).join('');
        }

        let currentGradeFilter = -1;
        function filterGrade(idx, el) {
            currentGradeFilter = idx;
            document.querySelectorAll('.grade-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderSeatMap(idx);
        }

        function toggleSeat(r, c) {
            const seat = state.seatMap[r][c];
            if (seat.type === 'taken' || seat.type === 'gap') return;

            const existIdx = state.selectedSeats.findIndex(s => s.row === r && s.col === c);
            if (existIdx >= 0) {
                state.selectedSeats.splice(existIdx, 1);
            } else {
                if (state.selectedSeats.length >= state.maxSeats) {
                    alert(`최대 ${state.maxSeats}매까지 선택 가능합니다.`);
                    return;
                }
                state.selectedSeats.push({ ...seat, row: r, col: c });
            }

            updateSeatInfo();
            renderSeatMap(currentGradeFilter);
        }

        function removeSeat(r, c) {
            state.selectedSeats = state.selectedSeats.filter(s => !(s.row === r && s.col === c));
            updateSeatInfo();
            renderSeatMap(currentGradeFilter);

            const e = state.currentEvent;
            const listDiv = document.getElementById('selected-seat-list');

                listDiv.innerHTML = '<div style="color:#aaa; font-size:0.85rem;">좌석을 선택해주세요</div>';

            const total = state.selectedSeats.reduce((sum, s) => sum + e.grades[s.grade].price, 0);

            document.getElementById('total-amount').textContent = total.toLocaleString() + '원';

        let currentCaptcha = '';
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            currentCaptcha = '';
            for (let i = 0; i < 6; i++) {
                currentCaptcha += chars[Math.floor(Math.random() * chars.length)];
            }
            return currentCaptcha;
        }

        function refreshCaptcha() {
            const text = generateCaptcha();
            document.getElementById('captcha-display').textContent = text;
            document.getElementById('captcha-input').value = '';
        }

        function selectPayment(method, el) {
            state.paymentMethod = method;
            document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
            el.classList.add('selected');
        }

        function processPayment() {
            const captchaInput = document.getElementById('captcha-input').value.toUpperCase();

            if (!state.paymentMethod) {
                alert('결제 수단을 선택해주세요.');
                return;
            }

            if (captchaInput !== currentCaptcha) {
                alert('자동입력 방지 문자가 일치하지 않습니다.');
                refreshCaptcha();
                return;
            }

            document.getElementById('pay-btn').disabled = true;
            document.getElementById('pay-btn').textContent = '결제 처리 중...';

            // 결제 처리 시뮬레이션 (80% 성공률)
            setTimeout(() => {
                clearInterval(state.timer);
                const success = Math.random() < 0.8;

                if (success) {
                    showResult('success');
                } else {
                    // 실패 이유 랜덤
                    const reasons = [
                        '다른 사용자가 먼저 결제를 완료했습니다.',
                        '결제 처리 중 오류가 발생했습니다.',
                        '선택하신 좌석이 이미 예매되었습니다.',
                        '결제 시간이 초과되었습니다.'
                    ];
                    showResult('fail', reasons[Math.floor(Math.random() * reasons.length)]);
                }
            }, 2000 + Math.random() * 2000);
        }

        // ========== 결과 화면 ==========
        function showResult(type, reason) {
            clearInterval(state.timer);
            const overlay = document.getElementById('result-overlay');
            const box = document.getElementById('result-box');
            const e = state.currentEvent;

            if (type === 'success') {
                const total = state.selectedSeats.reduce((sum, s) => sum + e.grades[s.grade].price, 0);
                const orderNum = 'IP' + Date.now().toString().slice(-10);

                box.innerHTML = `
                    <div class="result-icon">🎉</div>
                    <h2 style="color:#502b6e;">예매가 완료되었습니다!</h2>
                    <p>축하합니다! 티켓팅에 성공하셨습니다.</p>
                    <div class="result-details">
                        <div class="result-detail-row"><span class="label">예매번호</span><span>${orderNum}</span></div>
                        <div class="result-detail-row"><span class="label">공연</span><span>${e.title}</span></div>
                        <div class="result-detail-row"><span class="label">일시</span><span>${state.selectedDate} ${state.selectedTime}</span></div>
                        <div class="result-detail-row"><span class="label">장소</span><span>${e.venue}</span></div>
                        <div class="result-detail-row"><span class="label">좌석</span><span>${state.selectedSeats.map(s => s.label).join(', ')}</span></div>
                        <div class="result-detail-row"><span class="label">결제금액</span><span style="font-weight:bold;color:#e91e63;">${total.toLocaleString()}원</span></div>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" onclick="resetAll()">다시 하기</button>
                    </div>
                `;
            } else if (type === 'timeout') {
                box.className = 'result-box fail-result';
                box.innerHTML = `
                    <div class="result-icon">⏰</div>
                    <h2>시간이 초과되었습니다</h2>
                    <p>제한 시간 내에 결제를 완료하지 못했습니다.<br>선택하신 좌석은 자동으로 해제됩니다.</p>
                    <div class="btn-row">
                        <button class="btn btn-primary" onclick="resetAll()">다시 하기</button>
                    </div>
                `;
            } else {
                box.className = 'result-box fail-result';
                box.innerHTML = `
                    <div class="result-icon">😢</div>
                    <h2>예매에 실패했습니다</h2>
                    <p>${reason || '알 수 없는 오류가 발생했습니다.'}<br>다시 시도해 주세요.</p>
                    <div class="btn-row">
                        <button class="btn btn-secondary" onclick="closeResult(); goToStep('list');">목록으로</button>
                        <button class="btn btn-primary" onclick="resetAll()">다시 하기</button>
                    </div>
                `;
            }

            overlay.classList.add('show');
        }

        function closeResult() {
            document.getElementById('result-overlay').classList.remove('show');
        }

        function resetAll() {
            clearInterval(state.timer);
            state.currentEvent = null;
            state.selectedDate = null;
            state.selectedTime = null;
            state.selectedGrade = 0;
            state.selectedSeats = [];
            state.paymentMethod = null;
            closeResult();
            goToStep('list');
        }

        // ========== 네비게이션 ==========
        function goToStep(stepName) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step-${stepName}`).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== 초기화 ==========
        renderEventList();
    </script>
</body>
</html>
